# プレフィックスを Ctrl+a に変更（使いやすい人向け）
unbind C-b
set -g prefix C-a
bind C-a send-prefix


# または、もっと直感的に矢印キーで分割（オプション）
bind w split-window -v -b -c "#{pane_current_path}"   # Ctrl+a, w = 上に分割（横分割）
bind a split-window -h -b -c "#{pane_current_path}"   # Ctrl+a, a = 左に分割（縦分割）
bind s split-window -v -c "#{pane_current_path}"      # Ctrl+a, s = 下に分割（横分割）
bind d split-window -h -c "#{pane_current_path}"      # Ctrl+a, d = 右に分割（縦分割）
#viモードで選択や移動を快適に
setw -g mode-keys vi

# Ctrl+x でペインを閉じる
bind x kill-pane

# ペイン移動を Ctrl+矢印に
bind h select-pane -L   # Ctrl+a, h = 左へ
bind j select-pane -D   # Ctrl+a, j = 下へ
bind k select-pane -U   # Ctrl+a, k = 上へ
bind l select-pane -R    # Ctrl+a, l = 右へ

# マウスでペイン切り替え＆スクロール有効化
set -g mouse on

# ステータスバーの色を変える（任意）
set -g status-bg colour235
set -g status-fg white
set -g status-left '[#S]'
set -g status-right '#(date "+%Y-%m-%d %H:%M")'
# Codex CLI の自動承認を tmux 全体に適用
set-environment -g CODEXCLI_AUTO_APPROVE true

